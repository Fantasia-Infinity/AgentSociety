[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-bot-core"
version = "0.4.0"
description = "Local-first agent collaboration hub, Pi host, and thin WeChat gateway"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
wechat-bot-core = "wechat_bot.api:main"
wechat-bot-local-llm = "wechat_bot.local_model:main"
wechat-gateway = "wechat_gateway.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
