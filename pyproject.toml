[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-society"
version = "0.4.0"
description = "AgentSociety local-first agents, optional collaboration hub, and channel adapters"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agent-hub = "agent_hub.server:main"
wechat-bot-core = "wechat_bot.api:main"
wechat-bot-local-llm = "wechat_bot.local_model:main"
wechat-gateway = "wechat_gateway.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
