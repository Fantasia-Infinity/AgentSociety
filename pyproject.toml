[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-society"
version = "0.4.0"
description = "AgentSociety local-first agents, optional collaboration hub, and channel adapters"
requires-python = ">=3.11"
dependencies = ["argon2-cffi>=23.1,<24"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
s3 = ["boto3>=1.35,<2"]
oidc = ["PyJWT>=2.8,<3", "cryptography>=42"]

[project.scripts]
agent-hub = "agent_hub.server:main"
agent-hub-mcp = "agent_hub.mcp_server:main"
wechat-bot-core = "wechat_core.api:main"
wechat-bot-local-llm = "wechat_core.local_model:main"
wechat-gateway = "wechat_gateway.main:main"
agent-channel-mcp = "agent_channel.mcp_server:main"
agent-hub-migrate-postgres = "agent_hub.migrate:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
