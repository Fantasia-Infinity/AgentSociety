services:
  agent-hub:
    build:
      context: ../..
      dockerfile: deploy/hub/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.hub
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - hub-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2).read()
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  hub-data:
