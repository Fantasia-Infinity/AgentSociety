# AgentSociety DeepSeek Harness worker composition.
# stdout is reserved for the dsh SDK JSON-RPC protocol; do not add console loggers.
# The AgentSociety DshAgentEngine drives this runtime and supplies every DSH_* /
# AGENT_SOCIETY_* environment variable referenced below.

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: false

# Credential fallback: AgentSociety passes DEEPSEEK_API_KEY when it owns one;
# otherwise dsh resolves the key from $DSH_HOME/.credentials.yaml.
- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

# The DeepSeek adapter. Exact model, capacity, and output cap arrive per runtime
# over the JSON-RPC initialize call and the env below.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: !!js process.env.DSH_THINKING ?? 'enabled'
    reasoningEffort: !!js process.env.DSH_REASONING_EFFORT ?? 'high'
    maxTokens: !!js Number(process.env.DSH_MAX_TOKENS ?? 8192)
    defaultContextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 128000)
    models:
      - id: !!js process.env.DSH_MODEL ?? 'deepseek-v4-flash'
        contextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 128000)
        maxTokens: !!js Number(process.env.DSH_MAX_TOKENS ?? 8192)

# Workspace sandbox. DSH_PERMISSION_MODE defaults to workspace-write and
# read_only worker policies select read-only. danger-full-access is opt-in.
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.env.DSH_CWD ?? process.cwd()

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-sandbox'
  disabled: !!js process.env.DSH_TOOL_POLICY !== 'full'
  config:
    timeoutMs: 60000

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: !!js "(process.env.DSH_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask'"

# Providerless agent spine: the SDK server creates one agent per session/prompt.
- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Verify your work by running the code or tests. Keep answers brief and factual.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1

# Filesystem tools. read_only keeps reads available while sandbox-policy denies
# writes; no_tools disables the rows entirely.
- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
  disabled: !!js process.env.DSH_TOOL_POLICY === 'no_tools'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'
  disabled: !!js process.env.DSH_TOOL_POLICY === 'no_tools'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
  disabled: !!js process.env.DSH_TOOL_POLICY === 'no_tools'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  disabled: !!js process.env.DSH_TOOL_POLICY === 'no_tools'
  config:
    sampleOverCapGlobResults: false

- id: tool-str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'
  disabled: !!js process.env.DSH_TOOL_POLICY !== 'full'
  config:
    maxOutputChars: 16000

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  disabled: !!js process.env.DSH_TOOL_POLICY !== 'full'
  config:
    allowParallelInProgress: true

# Sub-agent delegation for the full tool policy only.
- id: subagent
  name: '@deepseek-ai/dsh-subagent'
  disabled: !!js process.env.DSH_TOOL_POLICY !== 'full'

- id: subagent-spawn-in-process
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  disabled: !!js process.env.DSH_TOOL_POLICY !== 'full'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  disabled: !!js process.env.DSH_TOOL_POLICY !== 'full'
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false

# Provider-neutral web search. Opt in with AGENT_DSH_WEB_SEARCH=1; the plugin
# packages must be resolvable from the runtime installation.
- id: web
  name: '@deepseek-ai/dsh-web'
  disabled: !!js process.env.AGENT_SOCIETY_WEB_SEARCH !== '1'
  config:
    searchProvider: deepseek-official

- id: web-search-deepseek
  name: '@deepseek-ai/dsh-web-search-deepseek'
  disabled: !!js process.env.AGENT_SOCIETY_WEB_SEARCH !== '1'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  disabled: !!js process.env.AGENT_SOCIETY_WEB_SEARCH !== '1'
  config:
    fetch: false
    searchTimeoutMs: 60000

# Optional in-runtime bridge back to the AgentSociety Hub. The engine disables
# this row by setting AGENT_SOCIETY_HUB_ENABLED=0 when no Hub is configured.
- id: agent-society-hub-mcp
  name: '@deepseek-ai/dsh-mcp-client'
  disabled: !!js process.env.AGENT_SOCIETY_HUB_ENABLED !== '1'
  config:
    transport: streamable-http
    serverName: agent-society
    url: !!js '`${(process.env.AGENT_SOCIETY_HUB_URL ?? "").replace(/\/$/u, "")}/mcp`'
    headers:
      Authorization: !!js '`Bearer ${process.env.AGENT_SOCIETY_HUB_MCP_TOKEN ?? ""}`'
    failOnStartupError: false
    reconnect:
      enabled: true
