# dsh patch layer connecting DeepSeek Harness sessions to an AgentSociety Hub.
#
# Usage:
#   AGENT_SOCIETY_HUB_URL=http://127.0.0.1:8090 \
#   AGENT_SOCIETY_HUB_MCP_TOKEN='<token>' \
#   dsh web --patch /path/to/AgentSociety/agent-host/dsh/agent-society.dsh.yml
#
# AgentSociety's `./agent dsh-dispatch` command applies this patch
# automatically using the node credential resolved by the AgentSociety CLI.
- insert:
    - id: agent-society-hub
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: streamable-http
        serverName: agent-society
        url: !!js '`${(process.env.AGENT_SOCIETY_HUB_URL ?? "http://127.0.0.1:8090").replace(/\/$/u, "")}/mcp`'
        headers:
          Authorization: !!js '`Bearer ${process.env.AGENT_SOCIETY_HUB_MCP_TOKEN ?? ""}`'
        failOnStartupError: false
        reconnect:
          enabled: true
