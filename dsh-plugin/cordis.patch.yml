# AgentSociety dsh bundle.
#
# Worker row: enabled with AGENT_SOCIETY_WORKER=1. TUI/web profiles without
# that flag load only the Hub MCP tools below.
- insert:
    - id: agent-society-worker
      name: '@agent-society/dsh-agent-society/worker'
      disabled: !!js process.env.AGENT_SOCIETY_WORKER !== '1'
      config:
        hubUrl: !!js process.env.AGENT_SOCIETY_HUB_URL
        hubTokenEnv: 'AGENT_SOCIETY_HUB_TOKEN'
        pollSeconds: !!js Number(process.env.AGENT_SOCIETY_POLL_SECONDS ?? 20)
        leaseSeconds: !!js Number(process.env.AGENT_SOCIETY_LEASE_SECONDS ?? 300)
        workspaceRoot: !!js process.env.AGENT_SOCIETY_WORKSPACE_ROOT ?? process.cwd()
        sessionMode: !!js process.env.AGENT_SOCIETY_SESSION_MODE ?? 'per_task'
        toolPolicy: !!js process.env.AGENT_SOCIETY_TOOL_POLICY ?? 'full'
        selfUpdateEnabled: !!js process.env.AGENT_SELF_UPDATE !== '0'
        repositoryRoot: !!js process.env.AGENT_SOCIETY_REPOSITORY_ROOT
        actorId: !!js process.env.AGENT_SOCIETY_ACTOR_ID
        nodeId: !!js process.env.AGENT_SOCIETY_NODE_ID
        principalId: !!js process.env.AGENT_SOCIETY_PRINCIPAL_ID
        displayName: !!js process.env.AGENT_SOCIETY_DISPLAY_NAME
        provider: !!js process.env.AGENT_SOCIETY_PROVIDER ?? 'deepseek-official'
        model: !!js process.env.DSH_MODEL ?? process.env.AGENT_SOCIETY_MODEL ?? 'deepseek-v4-flash'
        maxTokens: !!js Number(process.env.AGENT_SOCIETY_MAX_TOKENS ?? 8192)
        # Consensus digests into the Hub shared memory (default off).
        # Consensus digests into the Hub shared memory (AGENT_SOCIETY_CONTEXT=0 disables).
        contextEnabled: !!js process.env.AGENT_SOCIETY_CONTEXT !== '0'
        # Answer Hub questions addressed to this actor when idle (default on).
        questionsEnabled: !!js process.env.AGENT_SOCIETY_QUESTIONS !== '0'

    # Dispatch surface: expose Hub coordination tools as mcp__agent-society__*.
    # This guard re-appends Hub tools after preset-level system-prompt
    # filters (for example anchored-standard) so dispatch stays available.
    - id: agent-society-hub-tool-guard
      name: '@agent-society/dsh-agent-society/hub-tool-guard'
      disabled: !!js process.env.AGENT_SOCIETY_HUB_MCP !== '1'

    - id: agent-society-hub-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js process.env.AGENT_SOCIETY_HUB_MCP !== '1'
      config:
        transport: streamable-http
        serverName: agent-society
        url: !!js '`${(process.env.AGENT_SOCIETY_HUB_URL ?? "http://127.0.0.1:8090").replace(/\/$/u, "")}/mcp`'
        headers:
          Authorization: !!js '`Bearer ${process.env.AGENT_SOCIETY_HUB_TOKEN ?? ""}`'
        failOnStartupError: false
        reconnect:
          enabled: true

    # Keep web_search visible even when a preset filters the assembled
    # catalog. With AGENT_SOCIETY_WEB_SEARCH=0 the same guard removes it
    # from every assembled catalog.
    - id: agent-society-web-tool-guard
      name: '@agent-society/dsh-agent-society/web-tool-guard'

    # Session directory sync: push local session rows and maintain the local
    # mirror of the Hub directory (~/.dsh/agent-society-directory.json).
    - id: agent-society-directory
      name: '@agent-society/dsh-agent-society/directory'
      disabled: !!js process.env.AGENT_SOCIETY_DIRECTORY === '0'
      config:
        hubUrl: !!js process.env.AGENT_SOCIETY_HUB_URL
        hubTokenEnv: 'AGENT_SOCIETY_HUB_TOKEN'
        principalId: !!js process.env.AGENT_SOCIETY_PRINCIPAL_ID
        actorId: !!js process.env.AGENT_SOCIETY_ACTOR_ID
        nodeId: !!js process.env.AGENT_SOCIETY_NODE_ID
        workspaceRoot: !!js process.env.AGENT_SOCIETY_WORKSPACE_ROOT ?? process.cwd()
        sessionMode: !!js process.env.AGENT_SOCIETY_SESSION_MODE ?? 'per_task'
        toolPolicy: !!js process.env.AGENT_SOCIETY_TOOL_POLICY ?? 'full'
        pullSeconds: !!js Number(process.env.AGENT_SOCIETY_DIRECTORY_PULL_SECONDS ?? 10)

    # Bounded shared-context prompt injection: consensus one-liners + the
    # session directory index, read from the local mirror after assembly.
    - id: agent-society-directory-index
      name: '@agent-society/dsh-agent-society/directory-index'
      disabled: !!js process.env.AGENT_SOCIETY_DIRECTORY === '0'

    # Interactive-process question handling: auto-answer while unattended
    # (or POLICY=standalone); with a human present (or POLICY=ask) questions
    # stay pending for the browser question card.
    - id: agent-society-question-bridge
      name: '@agent-society/dsh-agent-society/question-bridge'
      disabled: !!js process.env.AGENT_SOCIETY_QUESTIONS === '0'
      config:
        hubUrl: !!js process.env.AGENT_SOCIETY_HUB_URL
        hubTokenEnv: 'AGENT_SOCIETY_HUB_TOKEN'
        principalId: !!js process.env.AGENT_SOCIETY_PRINCIPAL_ID
        actorId: !!js process.env.AGENT_SOCIETY_ACTOR_ID
        nodeId: !!js process.env.AGENT_SOCIETY_NODE_ID
        workspaceRoot: !!js process.env.AGENT_SOCIETY_WORKSPACE_ROOT ?? process.cwd()
        provider: !!js process.env.AGENT_SOCIETY_PROVIDER ?? 'deepseek-official'
        model: !!js process.env.DSH_MODEL ?? process.env.AGENT_SOCIETY_MODEL ?? 'deepseek-v4-flash'
        maxTokens: !!js Number(process.env.AGENT_SOCIETY_MAX_TOKENS ?? 8192)
        policy: !!js process.env.AGENT_SOCIETY_QUESTION_POLICY ?? 'auto'
        pollSeconds: !!js Number(process.env.AGENT_SOCIETY_QUESTION_POLL_SECONDS ?? 10)

# Host-level DeepSeek web tool. The provider services stay mounted because
# presets may register their own tool-web row; disabling the host tool plus
# the assembly guard is enough to keep web_search out of the model catalog.
- id: tool-web
  disabled: !!js process.env.AGENT_SOCIETY_WEB_SEARCH === '0'

# Readable transcripts: the worker attaches these to Hub runs and `agent
# observe` reads them locally. zstd remains available by setting
# AGENT_SOCIETY_SESSION_COMPRESSION=zstd.
- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js process.env.AGENT_SOCIETY_SESSION_COMPRESSION || 'none'

# Process-wide default matches the worker policy. Per-task `input.tool_policy`
# overrides are appended as `sandbox/mode` events on the session itself.
- id: sandbox-policy
  config:
    mode: !!js "(process.env.AGENT_SOCIETY_TOOL_POLICY === 'full' ? 'workspace-write' : 'read-only')"
    workspaceRoot: !!js process.env.AGENT_SOCIETY_WORKSPACE_ROOT ?? process.cwd()
